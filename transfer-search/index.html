<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>전사지 코드 검색</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background-color: #f0f0f0;
        }

        body {
            padding: 10px;
            overflow-y: auto;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 5px;
            color: #333;
            text-align: center;
        }

        .subtitle {
            font-size: 13px;
            color: #999;
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        input[type="file"] {
            display: none;
        }

        .file-label {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.3s;
        }

        .file-label:active {
            background-color: #0b7dda;
        }

        .image-preview {
            display: none;
            width: 100%;
            margin: 15px 0;
            border-radius: 6px;
            max-height: 300px;
            object-fit: contain;
        }

        .image-preview.show {
            display: block;
        }

        button[type="submit"] {
            width: 100%;
            padding: 14px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button[type="submit"]:active {
            background-color: #45a049;
        }

        button[type="submit"]:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .result {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #e8f5e9;
            border-radius: 6px;
            border-left: 4px solid #4CAF50;
            text-align: center;
        }

        .result.show {
            display: block;
        }

        .result-code {
            font-size: 48px;
            font-weight: bold;
            color: #2196F3;
            margin: 15px 0;
            font-family: 'Courier New', monospace;
        }

        .result-confidence {
            font-size: 14px;
            color: #666;
        }

        .error {
            display: none;
            padding: 12px;
            background: #ffebee;
            color: #c62828;
            border-radius: 6px;
            border-left: 4px solid #c62828;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .error.show {
            display: block;
        }

        .loader {
            display: none;
            margin: 20px auto;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #2196F3;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loader.show {
            display: block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .stats {
            text-align: center;
            font-size: 12px;
            color: #999;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .retry-btn {
            display: none;
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background-color: #757575;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        .retry-btn.show {
            display: block;
        }

        .retry-btn:active {
            background-color: #616161;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>전사지 코드</h1>
        <p class="subtitle">디자인 코드를 즉시 검색하세요</p>

        <div class="error" id="error"></div>

        <form id="uploadForm">
            <div class="form-group">
                <input type="file" id="fileInput" accept="image/*" capture="environment" required>
                <label for="fileInput" class="file-label">사진 촬영 또는 선택</label>
            </div>

            <img id="preview" class="image-preview" alt="Preview">

            <button type="submit" id="submitBtn">코드 검색</button>
        </form>

        <div class="loader" id="loader"></div>

        <div class="result" id="result">
            <div style="color: #666; font-size: 14px;">디자인 코드</div>
            <div class="result-code" id="resultCode">OZ017</div>
            <div class="result-confidence">확신도: <span id="confidence">95</span>%</div>
        </div>

        <button class="retry-btn" id="retryBtn">다시 검색</button>

        <div class="stats" id="stats"></div>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');
        const submitBtn = document.getElementById('submitBtn');
        const loader = document.getElementById('loader');
        const result = document.getElementById('result');
        const error = document.getElementById('error');
        const retryBtn = document.getElementById('retryBtn');
        const statsDiv = document.getElementById('stats');

        // 백엔드 URL (로컬 또는 배포된 서버)
        const BACKEND_URL = 'http://192.168.1.3:8080';

        // 파일 선택 시 미리보기
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    preview.src = event.target.result;
                    preview.classList.add('show');
                    result.classList.remove('show');
                    error.classList.remove('show');
                    retryBtn.classList.remove('show');
                };
                reader.readAsDataURL(file);
            }
        });

        // 폼 제출
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const file = fileInput.files[0];
            if (!file) {
                showError('이미지를 선택하세요');
                return;
            }

            // FormData 생성
            const formData = new FormData();
            formData.append('image', file);

            loader.classList.add('show');
            submitBtn.disabled = true;
            error.classList.remove('show');

            try {
                const response = await fetch(BACKEND_URL + '/match', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error('서버 오류');
                }

                const data = await response.json();

                if (data.code) {
                    document.getElementById('resultCode').textContent = data.code;
                    document.getElementById('confidence').textContent = data.confidence || data.score;
                    result.classList.add('show');
                    retryBtn.classList.add('show');
                    loadStats();
                } else {
                    showError(data.message || '매칭 결과 없음');
                }
            } catch (err) {
                showError('서버 연결 실패: ' + err.message);
            } finally {
                loader.classList.remove('show');
                submitBtn.disabled = false;
            }
        });

        // 다시 검색
        retryBtn.addEventListener('click', function() {
            fileInput.value = '';
            preview.classList.remove('show');
            result.classList.remove('show');
            retryBtn.classList.remove('show');
            error.classList.remove('show');
            preview.src = '';
        });

        // 에러 표시
        function showError(message) {
            error.textContent = message;
            error.classList.add('show');
        }

        // 통계 로드
        async function loadStats() {
            try {
                const response = await fetch(BACKEND_URL + '/stats');
                if (response.ok) {
                    const data = await response.json();
                    statsDiv.textContent = 'DB: ' + data.designs + '개 디자인 저장됨';
                }
            } catch (err) {
                // 통계 로드 실패는 무시
            }
        }

        // 페이지 로드시 통계 표시
        loadStats();
    </script>
</body>
</html>
