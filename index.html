<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>컬러 드롭 — 뉴욕꼬맹이</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #0d0d0d;
    --arena: #161616;
    --card: #1e1e1e;
    --border: rgba(255,255,255,0.08);
    --text: #f0f0f0;
    --muted: rgba(255,255,255,0.4);
    --accent: #F9CA24;
    --green: #2E7D6F;
    --green-bg: rgba(46,125,111,0.18);
    --red: #D63031;
    --red-bg: rgba(214,48,49,0.18);
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    color: var(--text);
    overflow: hidden;
    touch-action: manipulation;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    padding: 12px 14px 16px;
  }

  /* ── HUD ── */
  .hud {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 2px;
    margin-bottom: 8px;
    flex-shrink: 0;
  }
  .hud-lives { display: flex; gap: 4px; }
  .heart {
    font-size: 20px;
    transition: transform .2s, opacity .2s;
    display: inline-block;
  }
  .heart.dead { opacity: 0.2; transform: scale(0.75); }
  .hud-center { text-align: center; }
  .score-val { font-size: 26px; font-weight: 700; color: var(--text); line-height: 1; }
  .score-lbl { font-size: 10px; color: var(--muted); margin-top: 1px; letter-spacing: 1px; text-transform: uppercase; }
  .lv-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    min-width: 52px;
    text-align: center;
  }

  /* ── COMBO BAR ── */
  .combo-wrap { margin-bottom: 8px; flex-shrink: 0; }
  .combo-bar {
    height: 3px;
    background: rgba(255,255,255,0.07);
    border-radius: 2px;
    overflow: hidden;
  }
  .combo-fill {
    height: 100%;
    width: 0%;
    border-radius: 2px;
    background: var(--accent);
    transition: width .15s ease;
  }
  .combo-label {
    font-size: 11px;
    color: var(--muted);
    text-align: right;
    margin-top: 3px;
    height: 14px;
    transition: opacity .3s;
  }

  /* ── ARENA ── */
  .arena {
    flex: 1;
    position: relative;
    background: var(--arena);
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid var(--border);
    margin-bottom: 10px;
    min-height: 0;
  }

  .speed-line {
    position: absolute;
    width: 1px;
    background: linear-gradient(transparent, rgba(255,255,255,0.12), transparent);
    animation: speed-fall linear infinite;
    top: -60px;
    height: 60px;
  }
  @keyframes speed-fall {
    from { top: -60px; }
    to { top: 110%; }
  }

  .block {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    border-radius: 20px;
    border: 2px solid rgba(255,255,255,0.12);
    transition: box-shadow .12s;
    will-change: top;
  }
  .block.pop { animation: block-pop .25s ease; }
  @keyframes block-pop {
    0%   { transform: translateX(-50%) scale(1); }
    50%  { transform: translateX(-50%) scale(1.12); }
    100% { transform: translateX(-50%) scale(1); }
  }

  .danger-zone {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 72px;
    border-top: 1px dashed rgba(255,80,80,0.25);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 10px;
  }
  .danger-label {
    font-size: 10px;
    letter-spacing: 2px;
    color: rgba(255,80,80,0.35);
    text-transform: uppercase;
  }

  .miss-flash {
    position: absolute;
    inset: 0;
    background: rgba(214,48,49,0.15);
    border-radius: 20px;
    animation: fade-out .5s ease forwards;
    pointer-events: none;
    z-index: 5;
  }
  @keyframes fade-out { from { opacity:1 } to { opacity:0 } }

  .combo-popup {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    color: var(--accent);
    font-size: 18px;
    font-weight: 700;
    pointer-events: none;
    z-index: 10;
    white-space: nowrap;
    animation: combo-rise .9s ease forwards;
  }
  @keyframes combo-rise {
    0%   { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    60%  { opacity: 1; transform: translateX(-50%) translateY(-30px) scale(1.15); }
    100% { opacity: 0; transform: translateX(-50%) translateY(-60px) scale(0.9); }
  }

  /* ── OVERLAY ── */
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.88);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 20px;
    z-index: 20;
    padding: 24px;
  }
  .overlay-emoji { font-size: 42px; margin-bottom: 8px; }
  .overlay-title { font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
  .overlay-sub { font-size: 13px; color: var(--muted); margin-bottom: 20px; text-align: center; line-height: 1.6; }
  .overlay-score { font-size: 52px; font-weight: 700; color: var(--accent); line-height: 1; }
  .overlay-scorelab { font-size: 12px; color: var(--muted); margin-top: 4px; margin-bottom: 24px; letter-spacing: 0.5px; }
  .start-btn {
    padding: 14px 40px;
    border-radius: 50px;
    border: none;
    background: var(--accent);
    color: #111;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.5px;
    font-family: inherit;
    transition: transform .12s;
    -webkit-tap-highlight-color: transparent;
  }
  .start-btn:active { transform: scale(0.96); }

  /* ── OPTIONS ── */
  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    flex-shrink: 0;
  }
  .opt-btn {
    padding: 0;
    height: 52px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--card);
    color: var(--text);
    font-size: 15px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: transform .08s, background .12s, border-color .12s;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .opt-btn:active:not(:disabled) { transform: scale(0.96); }
  .opt-btn.correct {
    border-color: var(--green);
    background: var(--green-bg);
    color: #7FCEC0;
    animation: flash-correct .3s ease;
  }
  .opt-btn.wrong {
    border-color: var(--red);
    background: var(--red-bg);
    color: #F08070;
    animation: shake .3s ease;
  }
  @keyframes flash-correct {
    0%   { background: rgba(46,125,111,0.4); }
    100% { background: var(--green-bg); }
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25%      { transform: translateX(-7px); }
    75%      { transform: translateX(7px); }
  }
</style>
</head>
<body>
<div id="app">
  <!-- HUD -->
  <div class="hud">
    <div class="hud-lives" id="lives-display"></div>
    <div class="hud-center">
      <div class="score-val" id="score-display">0</div>
      <div class="score-lbl">SCORE</div>
    </div>
    <div><span class="lv-badge" id="lv-badge">Lv 1</span></div>
  </div>

  <!-- Combo bar -->
  <div class="combo-wrap">
    <div class="combo-bar"><div class="combo-fill" id="combo-fill"></div></div>
    <div class="combo-label" id="combo-label"></div>
  </div>

  <!-- Arena -->
  <div class="arena" id="arena">
    <div class="speed-line" style="left:15%;animation-duration:1.1s;animation-delay:0s"></div>
    <div class="speed-line" style="left:50%;animation-duration:0.85s;animation-delay:0.4s"></div>
    <div class="speed-line" style="left:82%;animation-duration:1.3s;animation-delay:0.9s"></div>
    <div class="block" id="block"></div>
    <div class="danger-zone"><span class="danger-label">danger zone</span></div>
    <div class="overlay" id="overlay">
      <div class="overlay-emoji">🎮</div>
      <div class="overlay-title">컬러 드롭</div>
      <div class="overlay-sub">떨어지는 색상 블록을<br>바닥에 닿기 전에 맞춰요!</div>
      <button class="start-btn" id="start-btn">게임 시작</button>
    </div>
  </div>

  <!-- Answer buttons -->
  <div class="options" id="options">
    <button class="opt-btn" disabled></button>
    <button class="opt-btn" disabled></button>
    <button class="opt-btn" disabled></button>
    <button class="opt-btn" disabled></button>
  </div>
</div>

<script>
const COLORS = [
  {n:'화이트',h:'#F0F0F0'},{n:'블랙',h:'#1C1C1C'},{n:'그레이',h:'#9B9B9B'},
  {n:'차콜',h:'#3C3C3C'},{n:'백멜란지',h:'#DDD9CF'},{n:'네이비',h:'#1A2952'},
  {n:'블루',h:'#2B6CB0'},{n:'스카이블루',h:'#63B3ED'},{n:'스틸블루',h:'#4A7DBD'},
  {n:'마린블루',h:'#1B5E8C'},{n:'다크민트',h:'#2E7D6F'},{n:'민트',h:'#7FCEC0'},
  {n:'에메랄드',h:'#50C87C'},{n:'그린',h:'#4CAF50'},{n:'카키',h:'#6B7C3E'},
  {n:'레드',h:'#D63031'},{n:'다크핑크',h:'#C2185B'},{n:'핫핑크',h:'#E91E8C'},
  {n:'인디핑크',h:'#D4698A'},{n:'코랄핑크',h:'#F08070'},{n:'핑크',h:'#F8C8D4'},
  {n:'라이트핑크',h:'#FFADBF'},{n:'피치',h:'#FFCBA4'},{n:'코랄',h:'#FF7F50'},
  {n:'오렌지',h:'#E8821A'},{n:'옐로우',h:'#F9CA24'},{n:'레몬옐로우',h:'#ECEC6E'},
  {n:'퍼플',h:'#6C3483'},{n:'바이올렛',h:'#7C4DC4'},{n:'베이지',h:'#D4B896'},
  {n:'크림',h:'#FAF3E0'},{n:'오트밀',h:'#E8D9C0'},{n:'모카',h:'#967259'},
  {n:'브라운',h:'#795548'},{n:'네온핑크',h:'#FF1DCE'},{n:'네온그린',h:'#39FF14'},
  {n:'네온오렌지',h:'#FF6600'}
];

// ── State ──
let score = 0, lives = 3, level = 1, combo = 0;
let blockY = -110, raf = null;
let currentColor = null, opts = [], answered = false;
let gameActive = false;
let arenaH = 300, blockSize = 100, dangerY = 0;

const $arena  = document.getElementById('arena');
const $block  = document.getElementById('block');
const $opts   = document.getElementById('options');
const $overlay= document.getElementById('overlay');
const $score  = document.getElementById('score-display');
const $lv     = document.getElementById('lv-badge');
const $combo  = document.getElementById('combo-fill');
const $combLbl= document.getElementById('combo-label');
const $lives  = document.getElementById('lives-display');

function shuffle(a) { return [...a].sort(() => Math.random() - 0.5); }

function measure() {
  arenaH   = $arena.clientHeight;
  blockSize= Math.min(Math.round(arenaH * 0.32), 110);
  dangerY  = arenaH - 72;
  $block.style.width  = blockSize + 'px';
  $block.style.height = blockSize + 'px';
}

function getFallSpeed() { return 0.9 + (level - 1) * 0.22; }

function updateLives() {
  $lives.innerHTML = '';
  for (let i = 0; i < 3; i++) {
    const h = document.createElement('span');
    h.className = 'heart' + (i >= lives ? ' dead' : '');
    h.textContent = '♥';
    $lives.appendChild(h);
  }
}

function renderOpts() {
  $opts.innerHTML = '';
  opts.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.id = 'opt-' + c.n;
    btn.textContent = c.n;
    btn.addEventListener('touchstart', () => answer(c.n), { passive: true });
    btn.addEventListener('click', () => answer(c.n));
    $opts.appendChild(btn);
  });
}

function disableOpts() {
  $opts.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
}

function newRound() {
  answered = false;
  const pool = shuffle(COLORS);
  currentColor = pool[0];
  const wrongs = pool.slice(1, 4);
  opts = shuffle([currentColor, ...wrongs]);

  blockY = -blockSize - 10;
  $block.style.top = blockY + 'px';
  $block.style.background = currentColor.h;
  $block.style.boxShadow = 'none';
  $block.className = 'block pop';

  renderOpts();
  $combLbl.textContent = '';
}

function answer(chosen) {
  if (answered || !gameActive) return;
  answered = true;
  cancelAnimationFrame(raf);

  const isCorrect = chosen === currentColor.n;
  disableOpts();

  const chosenBtn  = document.getElementById('opt-' + chosen);
  const correctBtn = document.getElementById('opt-' + currentColor.n);

  if (isCorrect) {
    chosenBtn.classList.add('correct');
    $block.style.boxShadow = '0 0 0 8px rgba(46,125,111,0.5)';
    const bonus = combo * 2;
    score += 10 + bonus;
    combo++;
    $score.textContent = score;
    level = Math.max(1, Math.ceil(combo / 5));
    $lv.textContent = 'Lv ' + level;
    const fillPct = Math.min((combo % 5) / 5 * 100, 100);
    $combo.style.width = fillPct + '%';
    $combLbl.textContent = combo >= 2 ? combo + ' 콤보! +' + bonus : '';

    if (combo >= 3) {
      const popup = document.createElement('div');
      popup.className = 'combo-popup';
      const mid = (arenaH - blockSize) / 2;
      popup.style.top = (blockY < mid ? blockY + blockSize + 12 : blockY - 36) + 'px';
      popup.textContent = combo >= 8 ? '🔥 ' + combo + '콤보!' : combo >= 5 ? '✨ ' + combo + '콤보!' : combo + '콤보!';
      $arena.appendChild(popup);
      setTimeout(() => popup.remove(), 900);
    }
  } else {
    chosenBtn.classList.add('wrong');
    correctBtn.classList.add('correct');
    $block.style.boxShadow = '0 0 0 8px rgba(214,48,49,0.4)';
    combo = 0;
    $combo.style.width = '0%';
    $combLbl.textContent = '';
    lives--;
    updateLives();
    spawnFlash();
    if (lives <= 0) { setTimeout(gameOver, 450); return; }
  }
  setTimeout(() => { newRound(); raf = requestAnimationFrame(fall); }, 550);
}

function spawnFlash() {
  const f = document.createElement('div');
  f.className = 'miss-flash';
  $arena.appendChild(f);
  setTimeout(() => f.remove(), 500);
}

function fall() {
  if (!gameActive) return;
  blockY += getFallSpeed();
  $block.style.top = blockY + 'px';

  if (blockY > dangerY) {
    $block.style.boxShadow = '0 0 20px rgba(255,60,60,0.6)';
  }

  if (blockY > arenaH) {
    if (!answered) {
      answered = true;
      const correctBtn = document.getElementById('opt-' + currentColor.n);
      if (correctBtn) correctBtn.classList.add('correct');
      disableOpts();
      combo = 0;
      $combo.style.width = '0%';
      $combLbl.textContent = '놓쳤어요!';
      lives--;
      updateLives();
      spawnFlash();
      if (lives <= 0) { setTimeout(gameOver, 450); return; }
      setTimeout(() => { newRound(); raf = requestAnimationFrame(fall); }, 700);
    }
    return;
  }
  raf = requestAnimationFrame(fall);
}

function startGame() {
  measure();
  score = 0; lives = 3; level = 1; combo = 0;
  gameActive = true;
  $score.textContent = '0';
  $lv.textContent = 'Lv 1';
  $combo.style.width = '0%';
  $combLbl.textContent = '';
  updateLives();
  $overlay.style.display = 'none';
  newRound();
  raf = requestAnimationFrame(fall);
}

function gameOver() {
  gameActive = false;
  cancelAnimationFrame(raf);
  const pct   = score;
  const emoji = pct >= 200 ? '🏆' : pct >= 100 ? '🎉' : pct >= 50 ? '😊' : '💪';
  const msg   = pct >= 200 ? '색상 마스터!' : pct >= 100 ? '대단해요!' : pct >= 50 ? '잘 하셨어요!' : '다시 도전!';
  $overlay.style.display = 'flex';
  $overlay.innerHTML = `
    <div class="overlay-emoji">${emoji}</div>
    <div class="overlay-title">게임 오버</div>
    <div class="overlay-sub">${msg}<br>Lv ${level} 도달</div>
    <div class="overlay-score">${score}</div>
    <div class="overlay-scorelab">최종 점수</div>
    <button class="start-btn" id="start-btn">다시 시작</button>`;
  document.getElementById('start-btn').addEventListener('click', startGame);
  document.getElementById('start-btn').addEventListener('touchstart', startGame, { passive: true });
}

// Initial start button
document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('start-btn').addEventListener('touchstart', startGame, { passive: true });

// Resize handling
window.addEventListener('resize', () => { if (gameActive) measure(); });
</script>
</body>
</html>
